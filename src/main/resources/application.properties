spring.application.name=recommendation-service

# ===== Основная БД: H2 с транзакциями клиентов (только чтение) =====
# Переопределяются переменными SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
spring.datasource.url=jdbc:h2:file:./transaction
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.read-only=true

# ===== Вторая БД: PostgreSQL с динамическими правилами и статистикой =====
# Переопределяются переменными RULES_DATASOURCE_JDBCURL / _USERNAME / _PASSWORD
rules.datasource.jdbc-url=jdbc:postgresql://localhost:5432/recommendation_rules
rules.datasource.username=rules_user
rules.datasource.password=rules_pass
rules.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.change-log=classpath:/db/changelog/changelog-master.sql

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ===== Telegram-бот: токен из переменной окружения TELEGRAM_BOT_TOKEN =====
# Пустой токен: сервис стартует, бот отключён
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# ===== OpenAPI / Swagger UI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
